spring.main.banner-mode=off
server.port=8080

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:prototipo_ventas}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Configuracion CORS: origenes autorizados separados por comas.
# Por defecto no se permiten solicitudes desde otros origenes.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
