<section class="panel" aria-labelledby="cart-title">
  <h2 id="cart-title">Carrito</h2>
  <app-state-message
    *ngIf="items.length === 0"
    [state]="state"
    message="El carrito está vacío. Agrega productos con su código y cantidad."
  ></app-state-message>

  <ng-container *ngIf="items.length > 0">
    <p class="cart-summary" aria-live="polite">
      {{ items.length }} producto(s) seleccionado(s), {{ totalQuantity }} unidad(es) en total.
    </p>
    <ul class="cart-list">
      <li *ngFor="let item of items">
        <div class="cart-item-details">
          <strong>{{ item.productCode }}</strong>
          <label>
            Cantidad
            <input
              #quantityInput
              type="number"
              min="1"
              step="1"
              required
              [value]="item.quantity"
              [attr.aria-label]="'Cantidad de ' + item.productCode"
              (change)="updateQuantity(item, quantityInput.valueAsNumber, quantityInput)"
            />
          </label>
        </div>
        <button
          class="button button-secondary"
          type="button"
          [attr.aria-label]="'Quitar producto ' + item.productCode + ' del carrito'"
          (click)="remove(item.productCode)"
        >Quitar</button>
      </li>
    </ul>
    <button class="button button-primary" type="button" (click)="prepareSale()">Preparar venta</button>
  </ng-container>
</section>
